name: Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'scripts/*.sh'
      - 'workstation/*.sh'
      - 'mise-plugins/*/bin/*'
      - 'tests/**'
  pull_request:
    paths:
      - 'scripts/*.sh'
      - 'workstation/*.sh'
      - 'mise-plugins/*/bin/*'
      - 'tests/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts ./workstation ./mise-plugins'

  unit-tests:
    name: Unit Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        run: bats tests/*.bats

  unit-tests-docker:
    name: Unit Tests (Arch Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unit test image
        run: docker build -f tests/Dockerfile.unit -t cachyos-unit-tests .
      - name: Run unit tests
        run: docker run --rm cachyos-unit-tests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build integration test image
        run: docker build -f tests/Dockerfile.integration -t cachyos-integration-tests .
      - name: Run integration tests
        run: docker run --rm --privileged cachyos-integration-tests
