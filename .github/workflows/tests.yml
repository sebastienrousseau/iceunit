name: Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'scripts/*.sh'
      - 'workstation/*.sh'
      - 'mise-plugins/*/bin/*'
      - 'installer/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'scripts/*.sh'
      - 'workstation/*.sh'
      - 'mise-plugins/*/bin/*'
      - 'installer/**'
      - 'tests/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './scripts ./workstation ./mise-plugins'
          additional_files: ''
          format: gcc
          severity: warning
        env:
          SHELLCHECK_OPTS: '-x'

  go-tests:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache-dependency-path: installer/go.sum
      - name: Vet
        run: cd installer && go vet ./...
      - name: Test
        run: cd installer && go test ./... -v

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit-tests:
    name: Unit Tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local

      - name: Run tests
        run: bats tests/*.bats

  unit-tests-docker:
    name: Unit Tests (Arch Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unit test image
        run: docker build -f tests/Dockerfile.unit -t cachyos-unit-tests .
      - name: Run unit tests
        run: docker run --rm cachyos-unit-tests

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build integration test image
        run: docker build -f tests/Dockerfile.integration -t cachyos-integration-tests .
      - name: Run integration tests
        run: docker run --rm --privileged cachyos-integration-tests
