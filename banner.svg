<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!-- Background is transparent (no rect) -->
  
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A56E0"/>
      <stop offset="100%" stop-color="#EE6FF8"/>
    </linearGradient>
    <!-- Filter for text readability on any background -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Side: MacBook Illustration (Moved further left) -->
  <g transform="translate(40, 120) scale(2.1)">
    <!-- MacBook body -->
    <rect x="40" y="20" width="240" height="145" rx="8" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <!-- Screen bezel -->
    <rect x="52" y="30" width="216" height="120" rx="4" fill="#11111b"/>
    
    <!-- Terminal content -->
    <text x="64" y="55" font-family="monospace" font-size="8" fill="#a6e3a1" font-weight="bold">❯ make install</text>
    <text x="64" y="70" font-family="monospace" font-size="7" fill="#89dceb">Running Iceunit (ICU) installer...</text>
    
    <!-- Success Items -->
    <text x="64" y="85" font-family="monospace" font-size="7" fill="#a6e3a1">✓ System Initialization</text>
    <text x="64" y="97" font-family="monospace" font-size="7" fill="#a6e3a1">✓ Thermal Setup (mbpfan)</text>
    <text x="64" y="109" font-family="monospace" font-size="7" fill="#a6e3a1">✓ Wi-Fi Firmware (BCM4377b)</text>
    
    <!-- Active Item -->
    <path d="M 64 122 L 200 122" stroke="#313244" stroke-width="4" stroke-linecap="round"/>
    <path d="M 64 122 L 140 122" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="135" font-family="monospace" font-size="7" fill="#f5c2e7">Installing AI Dev Stack...</text>

    <!-- MacBook base -->
    <path d="M24 165 Q24 178 40 178 H280 Q296 178 296 165" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <circle cx="160" cy="172" r="3" fill="#45475a"/>
  </g>

  <!-- Right Side: Branding & Hook (Shifted left to prevent cutoff) -->
  <g transform="translate(620, 240)" filter="url(#shadow)">
    <!-- Iceunit Logo/Text -->
    <text font-family="system-ui, sans-serif" font-size="84" font-weight="900" fill="#cba6f7" letter-spacing="-2">Iceunit <tspan fill="#89dceb">(ICU)</tspan></text>
    
    <!-- Hook (Multi-line to ensure visibility and AAA scaling) -->
    <text y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Turbocharge your T2 MacBook</text>
    <text y="120" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Air 2020 (Intel)</text>
    
    <text y="175" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#bac2de">Optimised CachyOS performance suite.</text>
    
    <!-- Badge Tags -->
    <g transform="translate(0, 220)">
      <rect width="140" height="36" rx="18" fill="#313244"/>
      <text x="70" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">THERMAL FIXED</text>
      
      <rect x="155" width="140" height="36" rx="18" fill="#313244"/>
      <text x="225" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#89dceb">WI-FI ENABLED</text>
      
      <rect x="310" width="140" height="36" rx="18" fill="#313244"/>
      <text x="380" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f5c2e7">AI READY</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect y="632" width="1280" height="8" fill="url(#grad)"/>
</svg>
