<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!-- Define filters and gradients for UI harmony -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A56E0"/>
      <stop offset="100%" stop-color="#EE6FF8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Section: MacBook (Positioned using Golden Ratio logic) -->
  <!-- 1280 / 1.618 = 791 (Major) | 1280 - 791 = 489 (Minor) -->
  <!-- Centering MacBook in the minor section (Left) -->
  <g transform="translate(60, 158) scale(1.8)" filter="url(#shadow)">
    <!-- MacBook body -->
    <rect x="40" y="20" width="240" height="145" rx="8" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <!-- Screen bezel -->
    <rect x="52" y="30" width="216" height="120" rx="4" fill="#11111b"/>
    
    <!-- Terminal content -->
    <text x="64" y="55" font-family="monospace" font-size="8" fill="#a6e3a1" font-weight="bold">❯ make install</text>
    <text x="64" y="70" font-family="monospace" font-size="7" fill="#89dceb">Running Iceunit (ICU) installer...</text>
    
    <!-- Success Items -->
    <text x="64" y="85" font-family="monospace" font-size="7" fill="#a6e3a1">✓ System Initialization</text>
    <text x="64" y="97" font-family="monospace" font-size="7" fill="#a6e3a1">✓ Thermal Setup (mbpfan)</text>
    <text x="64" y="109" font-family="monospace" font-size="7" fill="#a6e3a1">✓ Wi-Fi Firmware (BCM4377b)</text>
    
    <!-- Active Item -->
    <path d="M 64 122 L 200 122" stroke="#313244" stroke-width="4" stroke-linecap="round"/>
    <path d="M 64 122 L 140 122" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="135" font-family="monospace" font-size="7" fill="#f5c2e7">Installing AI Dev Stack...</text>

    <!-- MacBook base -->
    <path d="M24 165 Q24 178 40 178 H280 Q296 178 296 165" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <circle cx="160" cy="172" r="3" fill="#45475a"/>
  </g>

  <!-- Right Section: Branding & Hook (Centered in Major section) -->
  <g transform="translate(640, 170)" filter="url(#shadow)">
    <!-- Iceunit Logo -->
    <text font-family="system-ui, sans-serif" font-size="84" font-weight="900" fill="#cba6f7" letter-spacing="-3">Iceunit <tspan fill="#89dceb">(ICU)</tspan></text>
    
    <!-- Hook Line 1 -->
    <text y="85" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Turbocharge your T2 MacBook</text>
    <!-- Hook Line 2 -->
    <text y="130" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Air 2020 (Intel)</text>
    
    <!-- Description -->
    <text y="185" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#bac2de">Optimised CachyOS performance suite.</text>
    
    <!-- Badges (Balanced Grid) -->
    <g transform="translate(0, 230)">
      <rect width="150" height="40" rx="20" fill="#313244"/>
      <text x="75" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#a6e3a1">THERMAL FIXED</text>
      
      <rect x="165" width="150" height="40" rx="20" fill="#313244"/>
      <text x="240" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#89dceb">WI-FI ENABLED</text>
      
      <rect x="330" width="150" height="40" rx="20" fill="#313244"/>
      <text x="405" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f5c2e7">AI READY</text>
    </g>
  </g>

  <!-- Bottom Accent (Golden Ratio based height) -->
  <rect y="630" width="1280" height="10" fill="url(#grad)"/>
</svg>
