<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <!-- Background -->
  <rect width="1280" height="640" fill="#1e1e2e"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#313244" stroke-width="1" opacity="0.5"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5A56E0"/>
      <stop offset="100%" stop-color="#EE6FF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#89dceb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1e1e2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Left Side: MacBook Illustration -->
  <g transform="translate(80, 120) scale(2.2)">
    <!-- MacBook body -->
    <rect x="40" y="20" width="240" height="145" rx="8" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <!-- Screen bezel -->
    <rect x="52" y="30" width="216" height="120" rx="4" fill="#11111b"/>
    
    <!-- Terminal content -->
    <text x="64" y="55" font-family="monospace" font-size="8" fill="#a6e3a1" font-weight="bold">❯ make install</text>
    <text x="64" y="70" font-family="monospace" font-size="7" fill="#89dceb">Running Iceunit (ICU) installer...</text>
    
    <!-- Success Items -->
    <text x="64" y="85" font-family="monospace" font-size="7" fill="#a6e3a1">✓ System Initialization</text>
    <text x="64" y="97" font-family="monospace" font-size="7" fill="#a6e3a1">✓ Thermal Setup (mbpfan)</text>
    <text x="64" y="109" font-family="monospace" font-size="7" fill="#a6e3a1">✓ Wi-Fi Firmware (BCM4377b)</text>
    
    <!-- Active Item -->
    <path d="M 64 122 L 200 122" stroke="#313244" stroke-width="4" stroke-linecap="round"/>
    <path d="M 64 122 L 140 122" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="135" font-family="monospace" font-size="7" fill="#f5c2e7">Installing AI Dev Stack...</text>

    <!-- MacBook base -->
    <path d="M24 165 Q24 178 40 178 H280 Q296 178 296 165" fill="#181825" stroke="#45475a" stroke-width="2"/>
    <circle cx="160" cy="172" r="3" fill="#45475a"/>
  </g>

  <!-- Right Side: Branding & Hook -->
  <g transform="translate(750, 240)">
    <!-- Iceunit Logo/Text -->
    <text font-family="system-ui, sans-serif" font-size="84" font-weight="900" fill="#cba6f7" letter-spacing="-2">Iceunit <tspan fill="#89dceb">(ICU)</tspan></text>
    
    <!-- Hook -->
    <text y="80" font-family="system-ui, sans-serif" font-size="32" font-weight="600" fill="#c6d0f5">Turbocharge your T2 MacBook Air 2020 (Intel)</text>
    <text y="125" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="#949cbb">Optimised CachyOS performance suite.</text>
    
    <!-- Badge Tags -->
    <g transform="translate(0, 180)">
      <rect width="140" height="36" rx="18" fill="#313244"/>
      <text x="70" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#a6e3a1">THERMAL FIXED</text>
      
      <rect x="155" width="140" height="36" rx="18" fill="#313244"/>
      <text x="225" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#89dceb">WI-FI ENABLED</text>
      
      <rect x="310" width="140" height="36" rx="18" fill="#313244"/>
      <text x="380" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#f5c2e7">AI READY</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect y="632" width="1280" height="8" fill="url(#grad)"/>
</svg>
